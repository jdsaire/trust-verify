name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # The hash router means the browser only ever requests the page's own path — the fragment
      # never reaches the server — so this is a defensive fallback for a literal unknown path, not
      # a functional requirement of the routing itself.
      - run: cp index.html 404.html

      # Only the deployable output: the built app, the static API fixtures it fetches at runtime
      # (assets/js has no server, so these are served as plain files), and the Jekyll opt-out.
      # Source, tests, and tooling never leave the runner.
      - run: |
          mkdir _site
          cp index.html 404.html .nojekyll _site/
          cp -r assets api _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
